<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>27 - Box Shadow</title>
<link rel="stylesheet" href="../../src/css/03-css.css">
<style>
body div.box {
border-radius: 20%;
height: 200px;
width: 200px;
background-color: rgba(160, 80, 255, 0.2);
margin: 0 auto;
}

body div.box1 {
box-shadow: 0 0 12px #a050ff;
}

body div.box2 {
box-shadow: -10px -10px 24px 0 #7a2acc;
}

body div.box3 {
box-shadow: 0 0 20px #c090ff;
}

body div.box4 {
box-shadow: 4px 4px 0 #a050ff,
8px 8px 0 #7a2acc,
12px 12px 0 #4a1a7a;
}

body div.images img {
width: 200px;
border-radius: 12px;
}

body div.images {
display: flex;
justify-content: center;
margin-block: 2rem;
gap: 1rem;
flex-wrap: wrap;
}

body div.images img:first-child {
box-shadow: 0 0 12px #a050ff;
}

body div.images img:last-child {
filter: drop-shadow(0 0 12px #a050ff);
}
</style>
</head>

<br>

<br>
<div class="box box3"></div>
