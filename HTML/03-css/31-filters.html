<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>31 - Filters</title>
<link rel="stylesheet" href="../../src/css/03-css.css">
<style>
body .filter-grid {
display: flex;
flex-wrap: wrap;
gap: 1rem;
justify-content: center;
margin: 1rem 0;
}

body .filter-item {
text-align: center;
}

body .filter-item img {
width: 150px;
height: 150px;
object-fit: cover;
border-radius: 10px;
transition: filter 0.3s ease;
}

body .filter-item p {
font-family: monospace;
font-size: 0.8rem;
margin-top: 0.4rem;
color: #a050ff;
}

body .f-blur { filter: blur(4px); }
body .f-bright { filter: brightness(1.5); }
body .f-contrast { filter: contrast(200%); }
body .f-grayscale { filter: grayscale(100%); }
body .f-sepia { filter: sepia(80%); }
body .f-hue { filter: hue-rotate(200deg); }
body .f-invert { filter: invert(100%); }
body .f-saturate { filter: saturate(300%); }
body .f-multi { filter: contrast(150%) brightness(1.2) sepia(30%); }
</style>
</head>
<body class="lesson-page">
<a href="indexcss.html" class="btn-home" aria-label="Volver al índice de CSS">

    </svg>
</a>
<main>
<header>
<h1>31 - Filters</h1>
<h2>CSS filter property applies visual effects like blur, brightness, contrast, and more.</h2>
</header>
<section>
<div class="recuadro">
<h3>Ejemplos de filter</h3>
<div class="filter-grid">
<div class="filter-item">
<img src="../../src/imgs/dk.png" class="f-blur">
<p>blur(4px)</p>
</div>
<div class="filter-item">
<img src="../../src/imgs/dk.png" class="f-bright">
<p>brightness(1.5)</p>
</div>
<div class="filter-item">
<img src="../../src/imgs/dk.png" class="f-contrast">
<p>contrast(200%)</p>
</div>
<div class="filter-item">
<img src="../../src/imgs/dk.png" class="f-grayscale">
<p>grayscale(100%)</p>
</div>
<div class="filter-item">
<img src="../../src/imgs/dk.png" class="f-sepia">
<p>sepia(80%)</p>
</div>
<div class="filter-item">

</div>
<div class="filter-item">

<div class="filter-item">
