<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 - Percentage Units</title>
    <link rel="stylesheet" href="../../src/css/03-css.css" />
    <style>

        main{
            width: 100%;
            section.percentage{

                margin: 0 auto;
                width: 80%;
                    div.parent{
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        div {
                            height: 50dvh;
                            font-size: 2rem;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            &.child1 {
                                width: 65%;
                                background: linear-gradient(180deg, #a050ff, #6030c0);
                                border-radius: 12px 0 0 12px;
                            }
                            &.child2 {
                                width: 35%;
                                background: linear-gradient(180deg, #00d68f, #005a30);
                                border-radius: 0 12px 12px 0;
                            }
                        }               
                    }
            }
        } 
        

    </style>
</head>
<body class="lesson-page">
    <a href="indexcss.html" class="btn-home" aria-label="Volver al índice de CSS">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    <main>
        <header>
            <h1>10 - Percentage Units</h1>
            <h2>Specify a length as a percentage of the parent element's dimension.</h2> 
        </header>
        <section class="percentage">
            <div class="parent">
                <div class="child1">70%</div>
                <div class="child2">30%</div>
            </div>
        </section>
    </main>
</body>
</html>
