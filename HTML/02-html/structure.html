    <main>
        <header>
            <h1>15 - Estructura</h1>
            <h2>header, main y footer</h2>
        </header>
        <section>
            <h3>Estructura basica de pagina</h3>
            <p>Esqueleto semantico tipico:</p>
            <pre><code>&lt;header&gt;...&lt;/header&gt;
&lt;main&gt;...&lt;/main&gt;
&lt;footer&gt;...&lt;/footer&gt;</code></pre>

            <header class="structure-block">
                <strong>Header:</strong> logo, titulo, navegacion
            </header>

            <div class="structure-block">
                <strong>Main:</strong> contenido principal de la pagina
            </div>

            <footer class="structure-block">
                <strong>Footer:</strong> contacto, derechos y enlaces
            </footer>
        </section>
    </main>
